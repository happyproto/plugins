name: Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  WASI_SDK_VERSION: "34.0"

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --check

  clippy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo clippy --target wasm32-unknown-unknown -- -D warnings

  build:
    runs-on: ubuntu-24.04
    needs: [fmt, clippy]
    steps:
      - uses: actions/checkout@v4

      - name: Add WASM target
        run: rustup target add wasm32-unknown-unknown

      - name: Build all plugins
        run: cargo build --release --target wasm32-unknown-unknown


  # The interpreters are the two members that are not pure Rust on
  # `wasm32-unknown-unknown`: they vendor PUC Lua and QuickJS-ng, which
  # `lua-src` and `rquickjs-sys` compile with clang from wasi-sdk. They get a
  # job of their own rather than widening the two above, because a 600 MB
  # toolchain download is a cost the other fifteen plugins do not need and
  # because a failure here should name the interpreter rather than look like
  # the workspace is broken. One matrix entry each, so a failure also names
  # which of the two.
  #
  # `checked` is every crate an entry lints and tests. The QuickJS engine is
  # not a plugin and has no module to build, so it rides with the JavaScript
  # interpreter, the plugin that runs its language unchanged.
  interpreter:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: happyview-lua
            checked: -p happyview-lua
            module: happyview_lua
            module_env: HAPPYVIEW_LUA_WASM
          - crate: happyview-javascript
            checked: -p happyview-javascript -p happyview-quickjs
            module: happyview_javascript
            module_env: HAPPYVIEW_JAVASCRIPT_WASM
    name: interpreter (${{ matrix.crate }})
    steps:
      - uses: actions/checkout@v4

      - name: Cache wasi-sdk
        id: wasi-sdk
        uses: actions/cache@v4
        with:
          path: /opt/wasi-sdk
          key: wasi-sdk-${{ env.WASI_SDK_VERSION }}-x86_64-linux

      - name: Install wasi-sdk
        if: steps.wasi-sdk.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/wasi-sdk.tar.gz \
            "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_SDK_VERSION%%.*}/wasi-sdk-${WASI_SDK_VERSION}-x86_64-linux.tar.gz"
          mkdir -p /opt/wasi-sdk
          tar -xzf /tmp/wasi-sdk.tar.gz --strip-components=1 -C /opt/wasi-sdk

      - name: Add WASI target
        run: rustup target add wasm32-wasip1

      # `/opt/wasi-sdk` is where `.cargo/config.toml` already points, so
      # `WASI_SDK`, the three `CC`/`AR`/`CFLAGS` variables and the linker's
      # `-L` need no setting here. Only `CARGO_TARGET_WASM32_WASIP1_RUSTFLAGS`
      # would, and plain `RUSTFLAGS` must not be used for it: it is not
      # target-scoped, and a `-L` into the wasi sysroot breaks every host build
      # in the same job, the crate's own tests included.
      - name: Clippy
        run: cargo clippy -j 2 ${{ matrix.checked }} --target wasm32-wasip1 -- -D warnings

      # Native, where the crate's logic is testable: the conformance corpora,
      # the 257 Lua 5.4 probes, the JavaScript event loop against a fake host,
      # and the module's own import and export sets.
      #
      # `TZ` because `os.time` reads a table as local time, as PUC does, and
      # the recorded Lua 5.4 reference was taken under UTC; JavaScript's `Date`
      # reads the machine's zone the same way. The modules themselves have no
      # zone to read; only a native run takes the machine's.
      - name: Test
        env:
          TZ: UTC
        run: cargo test -j 2 ${{ matrix.checked }}

      - name: Build
        run: cargo build -j 2 --release -p ${{ matrix.crate }} --target wasm32-wasip1

      # The import and export gate reads the built module, so it is only
      # meaningful after the build — which is why it runs again here. The path
      # is given rather than inferred, and checked first: absent, the gate
      # skips, and a gate that skips in CI is worse than no gate.
      - name: Check the module's interface
        run: |
          module="target/wasm32-wasip1/release/${{ matrix.module }}.wasm"
          test -f "$module"
          env "${{ matrix.module_env }}=$module" \
            cargo test -j 2 -p ${{ matrix.crate }} --test module_interface

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, interpreter]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write

    strategy:
      # One at a time: semantic-release pushes a tag and a git note per plugin,
      # and parallel pushes collide, leaving a tag with no release behind.
      max-parallel: 1
      fail-fast: false
      matrix:
        plugin:
          [
            auth-steam,
            auth-xbox,
            auth-microsoft,
            auth-itch,
            http,
            db,
            sql,
            backlinks,
            blobs,
            record,
            xrpc,
            atproto,
            linked-repos,
            jobs,
            spaces,
            lua,
            javascript,
          ]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install modules
        run: npm install

      - name: Add WASM target
        run: rustup target add wasm32-unknown-unknown

      # Only the two interpreters need either of these, and their
      # `.releaserc.json` files are the ones that build for `wasm32-wasip1`.
      - name: Add WASI target
        if: matrix.plugin == 'lua' || matrix.plugin == 'javascript'
        run: rustup target add wasm32-wasip1

      - name: Restore wasi-sdk
        if: matrix.plugin == 'lua' || matrix.plugin == 'javascript'
        uses: actions/cache@v4
        with:
          path: /opt/wasi-sdk
          key: wasi-sdk-${{ env.WASI_SDK_VERSION }}-x86_64-linux

      - name: Release happyview/${{ matrix.plugin }}
        working-directory: plugins/happyview/${{ matrix.plugin }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --yes semantic-release
