[workspace]
resolver = "2"
# A member's directory sits under the platform it plugs into, so a second
# platform's plugins can land beside HappyView's without every name repeating
# which one it is for.
members = [
    "plugins/*/*",
]
# `happyview-lua` vendors PUC Lua and `happyview-quickjs` QuickJS-ng, which
# compile only for a target their C toolchain knows, so neither they nor
# `happyview-javascript`, built on the QuickJS engine, are pure-Rust
# `wasm32-unknown-unknown` plugins. Keeping them out of the default set leaves
# a bare workspace build building the members that share one target.
default-members = [
    "plugins/happyview/atproto",
    "plugins/happyview/auth-itch",
    "plugins/happyview/auth-microsoft",
    "plugins/happyview/auth-steam",
    "plugins/happyview/auth-xbox",
    "plugins/happyview/backlinks",
    "plugins/happyview/blobs",
    "plugins/happyview/db",
    "plugins/happyview/http",
    "plugins/happyview/jobs",
    "plugins/happyview/linked-repos",
    "plugins/happyview/record",
    "plugins/happyview/spaces",
    "plugins/happyview/sql",
    "plugins/happyview/xrpc",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/happyproto/plugins"

[workspace.dependencies]
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
# The SDK is not published, so it comes from the branch HappyView's v3 work
# lives on until it is.
happyview-plugin-sdk = { git = "https://github.com/gamesgamesgamesgamesgames/happyview", branch = "alpha" }

# QuickJS-ng compiles its stack check out under WASI, so a script's runaway
# recursion traps the JavaScript interpreter instead of throwing a
# `RangeError`. The fork keeps the check, letting `JS_SetMaxStackSize` set a
# limit on WASI, and is otherwise rquickjs 0.14.0 exactly; it is pinned by
# revision so a push to the fork cannot change what builds here. Only
# `happyview-quickjs` depends on it.
[patch.crates-io]
rquickjs-sys = { git = "https://github.com/happyproto/rquickjs", rev = "8596e8ab03a8528c8cfa1b5e0627514d732cc887" }

[profile.release]
opt-level = "s"
lto = true
# A guest has no unwinder, and an interpreter's panic is a fault the host
# reads as a trap rather than something a plugin recovers from.
panic = "abort"
