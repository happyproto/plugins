name: Release

on:
  push:
    branches: [main, beta, alpha]
  pull_request:
    branches: [main, beta, alpha]

env:
  WASI_SDK_VERSION: "34.0"

jobs:
  fmt:
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: cargo fmt --check

  clippy:
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo clippy --target wasm32-unknown-unknown -- -D warnings

  # The filter that decides which commits release a plugin built on a crate
  # beside it. A mistake there releases nothing, silently, so it is tested
  # before anything is.
  release-config:
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --test release/*.test.mjs

  build:
    runs-on: depot-ubuntu-24.04
    needs: [fmt, clippy]
    steps:
      - uses: actions/checkout@v7

      - name: Add WASM target
        run: rustup target add wasm32-unknown-unknown

      # Shared across every job and matrix entry keyed on the lockfile: the
      # release matrix otherwise recompiles the same dependency tree once per
      # plugin, from cold, in series.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm

      - name: Build all plugins
        run: cargo build --release --target wasm32-unknown-unknown


  # The plugins that build for `wasm32-unknown-unknown` are tested natively,
  # where their logic runs: each library's own tests, among them that its API
  # surface parses, which HappyView refuses to install otherwise.
  test:
    runs-on: depot-ubuntu-24.04
    needs: [fmt, clippy]
    steps:
      - uses: actions/checkout@v7

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: native

      - name: Test
        run: cargo test -j 2

  # The declarations the interpreters render are handed to the language's own
  # checker with a sample handler each, so a renderer that writes something
  # tsc or lua-language-server rejects fails here rather than in an editor.
  declarations:
    runs-on: depot-ubuntu-24.04
    needs: [fmt, clippy]
    env:
      LUA_LANGUAGE_SERVER_VERSION: "3.19.2"
    steps:
      - uses: actions/checkout@v7

      # The renderers are native tests of the interpreter crates, which
      # compile their vendored C engines with wasi-sdk's clang settings in
      # `.cargo/config.toml`, so the toolchain is set up as for `interpreter`.
      - name: Cache wasi-sdk
        id: wasi-sdk
        uses: actions/cache@v6
        with:
          path: /opt/wasi-sdk
          key: wasi-sdk-${{ env.WASI_SDK_VERSION }}-x86_64-linux

      - name: Install wasi-sdk
        if: steps.wasi-sdk.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/wasi-sdk.tar.gz \
            "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_SDK_VERSION%%.*}/wasi-sdk-${WASI_SDK_VERSION}-x86_64-linux.tar.gz"
          mkdir -p /opt/wasi-sdk
          tar -xzf /tmp/wasi-sdk.tar.gz --strip-components=1 -C /opt/wasi-sdk

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: declarations

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install TypeScript
        run: npm ci

      - name: Install lua-language-server
        run: |
          mkdir -p /opt/lua-language-server
          curl -fsSL "https://github.com/LuaLS/lua-language-server/releases/download/${LUA_LANGUAGE_SERVER_VERSION}/lua-language-server-${LUA_LANGUAGE_SERVER_VERSION}-linux-x64.tar.gz" \
            | tar -xz -C /opt/lua-language-server

      - name: Check the rendered declarations
        env:
          LUA_LANGUAGE_SERVER: /opt/lua-language-server/bin/lua-language-server
        run: bash tests/declarations/check.sh

  # The interpreters are the members that are not pure Rust on
  # `wasm32-unknown-unknown`: they vendor PUC Lua and QuickJS-ng, which
  # `lua-src` and `rquickjs-sys` compile with clang from wasi-sdk. They get a
  # job of their own rather than widening the two above, because a 600 MB
  # toolchain download is a cost the other fifteen plugins do not need and
  # because a failure here should name the interpreter rather than look like
  # the workspace is broken. One matrix entry each, so a failure also names
  # which one.
  #
  # `checked` is every crate an entry lints and tests. The QuickJS engine is
  # not a plugin and has no module to build, so it rides with the JavaScript
  # interpreter, the plugin that runs its language unchanged.
  interpreter:
    runs-on: depot-ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: happyview-lua
            checked: -p happyview-lua
            module: happyview_lua
            module_env: HAPPYVIEW_LUA_WASM
          - crate: happyview-javascript
            checked: -p happyview-javascript -p happyview-quickjs
            module: happyview_javascript
            module_env: HAPPYVIEW_JAVASCRIPT_WASM
          - crate: happyview-typescript
            checked: -p happyview-typescript
            module: happyview_typescript
            module_env: HAPPYVIEW_TYPESCRIPT_WASM
    name: interpreter (${{ matrix.crate }})
    steps:
      - uses: actions/checkout@v7

      - name: Cache wasi-sdk
        id: wasi-sdk
        uses: actions/cache@v6
        with:
          path: /opt/wasi-sdk
          key: wasi-sdk-${{ env.WASI_SDK_VERSION }}-x86_64-linux

      - name: Install wasi-sdk
        if: steps.wasi-sdk.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/wasi-sdk.tar.gz \
            "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_SDK_VERSION%%.*}/wasi-sdk-${WASI_SDK_VERSION}-x86_64-linux.tar.gz"
          mkdir -p /opt/wasi-sdk
          tar -xzf /tmp/wasi-sdk.tar.gz --strip-components=1 -C /opt/wasi-sdk

      - name: Add WASI target
        run: rustup target add wasm32-wasip1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasi-${{ matrix.crate }}

      # `/opt/wasi-sdk` is where `.cargo/config.toml` already points, so
      # `WASI_SDK`, the three `CC`/`AR`/`CFLAGS` variables and the linker's
      # `-L` need no setting here. Only `CARGO_TARGET_WASM32_WASIP1_RUSTFLAGS`
      # would, and plain `RUSTFLAGS` must not be used for it: it is not
      # target-scoped, and a `-L` into the wasi sysroot breaks every host build
      # in the same job, the crate's own tests included.
      - name: Clippy
        run: cargo clippy -j 2 ${{ matrix.checked }} --target wasm32-wasip1 -- -D warnings

      # Native, where the crate's logic is testable: the conformance corpora,
      # the 257 Lua 5.4 probes, the JavaScript event loop against a fake host,
      # TypeScript's transforms and error positions, and the module's own
      # import and export sets.
      #
      # `TZ` because `os.time` reads a table as local time, as PUC does, and
      # the recorded Lua 5.4 reference was taken under UTC; JavaScript's `Date`
      # reads the machine's zone the same way. The modules themselves have no
      # zone to read; only a native run takes the machine's.
      - name: Test
        env:
          TZ: UTC
        run: cargo test -j 2 ${{ matrix.checked }}

      - name: Build
        run: cargo build -j 2 --release -p ${{ matrix.crate }} --target wasm32-wasip1

      # The import and export gate reads the built module, so it is only
      # meaningful after the build — which is why it runs again here. The path
      # is given rather than inferred, and checked first: absent, the gate
      # skips, and a gate that skips in CI is worse than no gate.
      - name: Check the module's interface
        run: |
          module="target/wasm32-wasip1/release/${{ matrix.module }}.wasm"
          test -f "$module"
          env "${{ matrix.module_env }}=$module" \
            cargo test -j 2 -p ${{ matrix.crate }} --test module_interface

  release:
    # Every branch semantic-release is configured to release from. A branch
    # it does not know is a no-op there, so the guard only has to keep a
    # pull request from releasing.
    if: github.event_name == 'push' && contains(fromJSON('["refs/heads/main", "refs/heads/beta", "refs/heads/alpha"]'), github.ref)
    needs: [build, interpreter, release-config, test, declarations]
    runs-on: depot-ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write

    strategy:
      # semantic-release pushes a tag and a git note per plugin. Those are
      # distinct refs, so concurrent pushes do not race each other for the
      # same one; what they can hit is the remote's own ref-lock contention,
      # which is transient. A few at a time trades a small retry risk for not
      # running eighteen cold builds end to end. If a tag ever lands with no
      # release behind it, this is the knob — put it back to 1.
      max-parallel: 4
      fail-fast: false
      matrix:
        plugin:
          [
            auth-steam,
            auth-xbox,
            auth-microsoft,
            auth-itch,
            http,
            db,
            sql,
            backlinks,
            blobs,
            record,
            xrpc,
            atproto,
            linked-repos,
            jobs,
            spaces,
            lua,
            javascript,
            typescript,
          ]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install modules
        run: npm ci

      - name: Add WASM target
        run: rustup target add wasm32-unknown-unknown

      # The same key the `build` job fills, so a plugin that does release
      # compiles against a warm dependency tree instead of a cold one.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm
          save-if: false

      # Only the interpreters need either of these, and their
      # `.releaserc.json` files are the ones that build for `wasm32-wasip1`.
      - name: Add WASI target
        if: contains(fromJSON('["lua", "javascript", "typescript"]'), matrix.plugin)
        run: rustup target add wasm32-wasip1

      - name: Restore wasi-sdk
        if: contains(fromJSON('["lua", "javascript", "typescript"]'), matrix.plugin)
        uses: actions/cache@v6
        with:
          path: /opt/wasi-sdk
          key: wasi-sdk-${{ env.WASI_SDK_VERSION }}-x86_64-linux

      - name: Release happyview/${{ matrix.plugin }}
        id: release
        working-directory: plugins/happyview/${{ matrix.plugin }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --yes semantic-release

      # Not semantic-release-export-data's new-release-version: the monorepo
      # wrappers hand its generateNotes the tag in place of the version. The
      # tag is exact, and prepareCmd wrote the same version to manifest.json.
      - name: Read the released version
        id: version
        if: steps.release.outputs.new-release-published == 'true'
        env:
          DIR: plugins/happyview/${{ matrix.plugin }}
          TAG: ${{ steps.release.outputs.new-release-git-tag }}
        run: |
          version=$(node release/release-config.mjs version "$DIR" "$TAG")
          manifest=$(jq -r .version "$DIR/manifest.json")
          if [ "$version" != "$manifest" ]; then
            echo "::error::$TAG names $version, but manifest.json says $manifest"
            exit 1
          fi
          {
            echo "version=$version"
            echo "wasm=$(node release/release-config.mjs wasm "$DIR")"
          } >> "$GITHUB_OUTPUT"

      - name: Publish happyview/${{ matrix.plugin }} to the registry
        if: steps.release.outputs.new-release-published == 'true'
        uses: happyproto/actions/plugin-publish@v1
        with:
          version: ${{ steps.version.outputs.version }}
          credential: ${{ secrets.HPY_CREDENTIAL }}
          working-directory: plugins/happyview/${{ matrix.plugin }}
          wasm: ${{ steps.version.outputs.wasm }}
          hpy-channel: beta
